# Local-only demonstration. Independent from docker-compose.http.yml and .env.server.
name: dentotime-demo

x-backend: &backend
  image: dentotime-demo-backend
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./demo:/app/demo:ro
  environment: &environment
    DJANGO_SETTINGS_MODULE: demo.settings
    DJANGO_ENVIRONMENT: development
    DEBUG: "False"
    SECRET_KEY: local-demo-django-secret-never-use-in-production
    JWT_SIGNING_KEY: local-demo-jwt-signing-key-never-use-in-production
    OTP_HASH_KEY: local-demo-otp-hash-key-never-use-in-production
    CAPTCHA_HASH_KEY: local-demo-captcha-key-never-use-in-production
    ALLOWED_HOSTS: localhost,127.0.0.1,backend
    CORS_ALLOWED_ORIGINS: http://localhost:3100
    CSRF_TRUSTED_ORIGINS: http://localhost:3100
    DB_NAME: dentotime_demo
    DB_USER: dentotime_demo
    DB_PASS: local-demo-database-password
    DB_HOST: demo-postgres
    DB_PORT: "5432"
    DB_SSLMODE: disable
    REDIS_URL: redis://demo-redis:6379/1
    CACHE_KEY_PREFIX: dentotime-demo
    CHAT_EVENT_STREAM_PREFIX: dentotime-demo:chat
    AWS_ACCESS_KEY_ID: dentotime-demo
    AWS_SECRET_ACCESS_KEY: local-demo-storage-password
    AWS_STORAGE_BUCKET_NAME: dentotime-demo
    AWS_S3_ENDPOINT_URL: http://demo-minio:9000
    AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:19000
    AWS_S3_REGION_NAME: us-east-1
    AWS_S3_SERVER_SIDE_ENCRYPTION: ""
    REQUIRE_CLAMAV: "False"
    CLAMAV_HOST: ""
    SMS_IR_API_KEY: ""
    SYSTEM_ADMIN_PHONE: ""
    SYSTEM_ADMIN_PASSWORD: ""
    UVICORN_FORWARDED_ALLOW_IPS: 127.0.0.1
    UVICORN_WORKERS: "1"

services:
  tests:
    <<: *backend
    profiles: [tests]
    user: root
    volumes:
      - .:/app:ro
    environment:
      <<: *environment
      DJANGO_ENVIRONMENT: test
      REDIS_URL: redis://demo-redis:6379/15
      CACHE_KEY_PREFIX: dentotime-demo-tests
      CHAT_EVENT_STREAM_PREFIX: dentotime-demo-tests:chat
      PYTHONDONTWRITEBYTECODE: "1"
    command: [sh, -c, "python -m pip install --index-url https://mirror-pypi.runflare.com/simple -r demo/test-requirements.txt && python -m pytest -p no:cacheprovider demo/tests --ds=demo.settings -q && python -m pytest -p no:cacheprovider tests --ds=config.settings -q"]
  demo-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dentotime_demo
      POSTGRES_USER: dentotime_demo
      POSTGRES_PASSWORD: local-demo-database-password
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dentotime_demo -d dentotime_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  demo-redis:
    image: redis:8-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  demo-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: dentotime-demo
      MINIO_ROOT_PASSWORD: local-demo-storage-password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3100
    volumes:
      - demo-minio:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
  demo-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      demo-minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -c]
    command: ['mc alias set demo http://demo-minio:9000 dentotime-demo local-demo-storage-password && mc mb --ignore-existing demo/dentotime-demo']
  demo-setup:
    <<: *backend
    healthcheck:
      disable: true
    depends_on:
      demo-postgres:
        condition: service_healthy
      demo-redis:
        condition: service_healthy
      demo-storage-init:
        condition: service_completed_successfully
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed_demo"]
  backend:
    <<: *backend
    depends_on:
      demo-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18000:8000"
  file-scanner:
    <<: *backend
    healthcheck:
      disable: true
    depends_on:
      demo-setup:
        condition: service_completed_successfully
    command: [python, manage.py, scan_pending_assets, --watch, --poll-seconds, "1"]
  frontend:
    image: dentotime-demo-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:19000
        ALLOW_INSECURE_HTTP: "true"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:19000
      ALLOW_INSECURE_HTTP: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  demo-postgres:
  demo-minio:
