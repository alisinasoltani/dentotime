name: dentotime-review

# HTTP-only review deployment.
#
# Run from this directory with:
#   docker compose --env-file .env.server -f docker-compose.http.yml up -d --build
#
# The frontend is the only publicly exposed application service. Django,
# PostgreSQL, Redis, and MinIO are kept on the Docker network (MinIO's API is
# additionally published when browser-direct multipart uploads are required).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dentotime}
      POSTGRES_USER: ${DB_USER:-dentotime}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - dentotime-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dentotime} -d ${DB_NAME:-dentotime}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dentotime-redis:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-dentotime-local-storage}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - dentotime-minio:/data
    # The API port must be reachable by reviewers' browsers for direct
    # presigned multipart uploads. Restrict it with the server firewall.
    ports:
      - "${MINIO_BIND_ADDRESS:-0.0.0.0}:9000:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 \"$${AWS_ACCESS_KEY_ID}\" \"$${AWS_SECRET_ACCESS_KEY}\"
      && mc mb --ignore-existing local/$${AWS_STORAGE_BUCKET_NAME}"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dentotime-local-storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-dentotime-uploads}
  backend-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env.server
    environment:
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-dentotime}
      DB_USER: ${DB_USER:-dentotime}
      DB_PASS: ${DB_PASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dentotime-local-storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-dentotime-uploads}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      SYSTEM_ADMIN_PHONE: ${SYSTEM_ADMIN_PHONE:-}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_system_admin --if-configured"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-dentotime}
      DB_USER: ${DB_USER:-dentotime}
      DB_PASS: ${DB_PASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dentotime-local-storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-dentotime-uploads}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      UVICORN_FORWARDED_ALLOW_IPS: ${UVICORN_FORWARDED_ALLOW_IPS:-127.0.0.1}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - dentotime-media:/app/media

  file-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - .env.server
    environment:
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-dentotime}
      DB_USER: ${DB_USER:-dentotime}
      DB_PASS: ${DB_PASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dentotime-local-storage}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-dentotime-uploads}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    command: ["python", "manage.py", "scan_pending_assets", "--watch", "--poll-seconds", "1"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        # Empty means browser calls use the same-origin /api rewrite.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_STORAGE_ORIGIN: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
        ALLOW_INSECURE_HTTP: "true"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_STORAGE_ORIGIN: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      ALLOW_INSECURE_HTTP: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"

volumes:
  dentotime-postgres:
  dentotime-redis:
  dentotime-minio:
  dentotime-media:
