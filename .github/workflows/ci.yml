name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dentotime_test
          POSTGRES_USER: dentotime_test
          POSTGRES_PASSWORD: dentotime-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentotime_test -d dentotime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENVIRONMENT: test
      DEBUG: "False"
      SECRET_KEY: ci-django-secret-key-that-is-not-used-outside-ci
      JWT_SIGNING_KEY: ci-jwt-signing-key-that-is-different-from-django
      OTP_HASH_KEY: ci-otp-hash-key-that-is-different-from-other-keys
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: dentotime_test
      DB_USER: dentotime_test
      DB_PASS: dentotime-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip check
      - run: python -m pip_audit --requirement requirements/base.txt --strict
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
