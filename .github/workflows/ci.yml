name: frontend-ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-release-gates:
    runs-on: ubuntu-latest
    env:
      BACKEND_INTERNAL_URL: https://api.example.invalid
      NEXT_PUBLIC_API_URL: https://api.example.invalid

    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Secret scan including history
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run analyze:bundle
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Generate frontend SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: sbom.cdx.json
      - name: Build production container
        run: >-
          docker build --tag dentotime-frontend:${{ github.sha }}
          --build-arg BACKEND_INTERNAL_URL=https://api.example.invalid
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid .
      - name: Verify production container runtime
        run: |
          test "$(docker image inspect dentotime-frontend:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint node dentotime-frontend:${{ github.sha }} -e "require('next/package.json'); console.log('Frontend runtime imports passed.')"
      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: dentotime-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy-frontend.sarif }
