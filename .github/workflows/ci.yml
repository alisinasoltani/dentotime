name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-release-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dentotime_test
          POSTGRES_USER: dentotime_test
          POSTGRES_PASSWORD: dentotime-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dentotime_test -d dentotime_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_ENVIRONMENT: test
      DEBUG: "False"
      SECRET_KEY: ci-django-secret-key-that-is-not-used-outside-ci
      JWT_SIGNING_KEY: ci-jwt-signing-key-that-is-different-from-django
      OTP_HASH_KEY: ci-otp-hash-key-that-is-different-from-other-keys
      CAPTCHA_HASH_KEY: ci-captcha-key-that-is-different-from-other-keys
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: dentotime_test
      DB_USER: dentotime_test
      DB_PASS: dentotime-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://127.0.0.1:6379/1
      AWS_ACCESS_KEY_ID: dentotime-ci-minio
      AWS_SECRET_ACCESS_KEY: dentotime-ci-minio-secret
      AWS_STORAGE_BUCKET_NAME: dentotime-ci-private
      AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_SERVER_SIDE_ENCRYPTION: ""
      REQUIRE_CLAMAV: "False"

    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Secret scan including history
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Start isolated S3-compatible storage
        run: |
          docker run --detach --name dentotime-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m pip check
      - run: python -m pip_audit --requirement requirements/production.lock --strict
      - run: python -m bandit -r accounts appointments config core messaging -x '*/migrations/*' -ll -ii
      - run: python -m compileall -q accounts appointments config core messaging
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Production deploy checks
        env:
          DJANGO_ENVIRONMENT: production
          SECRET_KEY: production-check-django-key-with-sufficient-entropy
          JWT_SIGNING_KEY: production-check-jwt-key-with-sufficient-entropy
          OTP_HASH_KEY: production-check-otp-key-with-sufficient-entropy
          CAPTCHA_HASH_KEY: production-check-captcha-key-with-sufficient-entropy
          ALLOWED_HOSTS: api.example.invalid
          CORS_ALLOWED_ORIGINS: https://app.example.invalid
          CSRF_TRUSTED_ORIGINS: https://app.example.invalid
          DB_SSLMODE: verify-full
          REDIS_URL: rediss://cache.example.invalid:6379/1
          REQUIRE_CLAMAV: "True"
          CLAMAV_HOST: scanner.example.invalid
        run: python manage.py check --deploy --fail-level WARNING
      - run: python scripts/storage_smoke.py
      - name: Fresh migration and full PostgreSQL test suite
        run: |
          python manage.py migrate --noinput
          pytest -q
      - name: Upgrade and rollback migration round-trip
        env: { DB_NAME: dentotime_migration_roundtrip }
        run: |
          python -c "import os, psycopg; c=psycopg.connect(dbname='postgres',host=os.environ['DB_HOST'],port=os.environ['DB_PORT'],user=os.environ['DB_USER'],password=os.environ['DB_PASS'],autocommit=True); c.execute('CREATE DATABASE dentotime_migration_roundtrip'); c.close()"
          python scripts/verify_migration_roundtrip.py
      - name: Backup and restore verification
        run: |
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17
          python scripts/verify_backup_restore.py
      - name: Deployed API smoke and bounded load gate
        run: |
          python -m uvicorn config.asgi:application --host 127.0.0.1 --port 8000 > /tmp/dentotime-api.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/v1/ready/ && break; sleep 1; done
          SMOKE_BACKEND_URL=http://127.0.0.1:8000 python scripts/smoke_deployment.py
          python -m pip install -r requirements/load.txt
          python manage.py shell -c "from django.core.cache import cache; cache.clear()"
          locust --headless --host http://127.0.0.1:8000 --users 3 --spawn-rate 1 --run-time 30s --locustfile locustfile_release.py
      - name: Generate backend SBOM
        run: ./scripts/generate_sbom.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: sbom.cdx.json
      - name: Build production container
        run: docker build --tag dentotime-backend:${{ github.sha }} .
      - name: Verify production container runtime
        run: |
          test "$(docker image inspect dentotime-backend:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint python dentotime-backend:${{ github.sha }} -m pip check
          docker run --rm --entrypoint python dentotime-backend:${{ github.sha }} -c "import django, psycopg, redis; print('Backend runtime imports passed.')"
      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: dentotime-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy-backend.sarif }
